<!doctype html>
<html lang="zh-Hant-TW" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>陳威廷｜AI 應用作品集</title>
<meta name="description" content="Willy (Chen Wei-Ting) · AI Application Portfolio — 18 projects built with Claude Code and other AI tools. 陳威廷 AI 應用作品集。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1116; --surface:#161B22; --surface-2:#1E2530; --line:#232933; --line-2:#3A4250;
  --text:#E8EAED; --text-2:#C9CED6; --muted:#9AA3AF; --faint:#8A93A0; --ghost:#2C3442;
  --accent:#F2B33D; --accent-hi:#FFD27A; --accent-bg:#2A2414; --on-accent:#0E1116;
  --ok:#7FD99A; --ok-line:#2F5A3D; --warn-line:#5A4718;
  --topbar-h:132px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans TC','Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}a:hover{color:var(--accent-hi)}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.mono{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);letter-spacing:.12em}
section,.hero{scroll-margin-top:calc(var(--topbar-h) + 12px)}

/* sticky top bar: header row + category row */
.topbar{position:sticky;top:0;z-index:30;background:rgba(14,17,22,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;padding:12px 0}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:17px;letter-spacing:.02em;color:var(--text);text-decoration:none}
.brand:hover{color:var(--text)}
.logo{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
nav a{color:var(--text-2);text-decoration:none;padding:10px 12px;font-size:15px}
nav a:hover{color:var(--text)}
nav a.pill{color:var(--bg);background:var(--text);padding:10px 16px;border-radius:999px;font-weight:500;margin-left:4px}

.catbar{display:flex;align-items:center;gap:10px;padding:0 0 12px;position:relative}
.menu-btn{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--accent);background:var(--accent-bg);color:var(--accent);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.menu-btn:hover,.menu-btn[aria-expanded="true"]{background:var(--accent);color:var(--on-accent)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--text-2);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.chips button:hover{border-color:#6B7585;color:var(--text)}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700}
.chips button span{opacity:.7;margin-left:6px;font-size:12px}

/* tree menu window */
.tree{position:absolute;left:0;top:calc(100% + 4px);width:min(440px,calc(100vw - 32px));max-height:min(70vh,620px);overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 30px 70px -20px rgba(0,0,0,.85);padding:10px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .18s,transform .18s}
.tree.show{opacity:1;transform:none;pointer-events:auto}
.tree-head{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.tree-head b{font-size:14px}
.tree-head button{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:6px 8px;border-radius:8px}
.tree-head button:hover{color:var(--text);background:var(--surface-2)}
.tnode{border-radius:10px}
.tnode-row{display:flex;align-items:center;gap:4px}
.caret{width:36px;height:40px;flex:none;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center}
.caret:hover{background:var(--surface-2);color:var(--text)}
.caret svg{transition:transform .2s}
.tnode.is-open .caret svg{transform:rotate(90deg)}
.tcat{flex:1;display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border:0;background:none;color:var(--text);font:inherit;font-size:15px;font-weight:700;text-align:left;cursor:pointer;border-radius:8px}
.tcat:hover{background:var(--surface-2)}
.tcat .ico{color:var(--accent);display:inline-flex}
.tcat em{margin-left:auto;font-style:normal;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.tkids{list-style:none;margin:0 0 6px 18px;padding:0 0 0 14px;border-left:1px dashed var(--line-2);display:none}
.tnode.is-open .tkids{display:block}
.tkids button{width:100%;display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border:0;background:none;color:var(--text-2);font:inherit;font-size:14px;text-align:left;cursor:pointer;border-radius:8px}
.tkids button:hover{background:var(--surface-2);color:var(--text)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--accent)}
.dot.ok{background:var(--ok)}.dot.doc{background:var(--faint)}

/* language toggle */
.lang-toggle{margin-left:6px;min-height:40px;display:inline-flex;align-items:center;gap:10px;padding:0 5px 0 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-family:'Space Grotesk',sans-serif;cursor:pointer;transition:border-color .2s}
.lang-toggle:hover{border-color:#6B7585}
.lang-toggle:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.globe{display:inline-flex;transition:transform .3s}
.lang-toggle:hover .globe{transform:rotate(-14deg)}
.track{position:relative;display:grid;grid-template-columns:1fr 1fr;width:84px;height:30px;border-radius:999px;background:var(--bg);font-size:13px;font-weight:700}
.track .knob{position:absolute;top:3px;left:3px;width:39px;height:24px;border-radius:999px;background:var(--accent);transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
html[data-lang="en"] .track .knob{transform:translateX(39px)}
.track .lbl{position:relative;display:flex;align-items:center;justify-content:center;color:var(--faint);transition:color .3s}
html[data-lang="zh"] .track .lbl-zh,html[data-lang="en"] .track .lbl-en{color:var(--on-accent)}
.spin svg{animation:spin .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes spin{50%{transform:rotate(200deg) scale(1.25)}to{transform:rotate(360deg)}}
.pop{animation:pop .45s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* hero */
.hero{padding:72px 0 56px;display:flex;flex-direction:column;gap:22px}
h1{margin:0;font-size:clamp(40px,6vw,72px);line-height:1.1;font-weight:900;letter-spacing:-.01em}
.role{margin:0;font-size:clamp(18px,2.2vw,24px);font-weight:500;color:var(--text-2)}
.role b{color:var(--accent);font-weight:700}
.tagline{margin:6px 0 0;font-size:clamp(24px,3.4vw,40px);line-height:1.3;font-weight:900;max-width:880px}
.tagline span{color:var(--accent)}
.lead{margin:0;max-width:720px;font-size:18px;line-height:1.75;color:var(--muted)}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 22px;border-radius:999px;text-decoration:none;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer;border:0}
.btn-accent{background:var(--accent);color:var(--on-accent)}
.btn-accent:hover{color:var(--on-accent);background:var(--accent-hi)}
.btn-ghost{border:1px solid var(--line-2);color:var(--text);background:transparent;font-weight:500}
.btn-ghost:hover{color:var(--text);border-color:#6B7585}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.stat b{display:block;font-family:'Space Grotesk',sans-serif;font-size:40px;line-height:1;color:var(--text)}
.stat span{display:block;margin-top:8px;font-size:14px;color:var(--muted)}
.stats-note{margin:0;font-size:13px;color:var(--faint)}

/* sections */
section{padding:72px 0;border-top:1px solid var(--line)}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:32px}
h2{margin:0;font-size:34px;font-weight:700}
.sec-sub{margin:8px 0 0;color:var(--muted);font-size:15px}

/* skills */
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
.panel h3{margin:0;font-size:18px}
.panel .note{margin:6px 0 20px;font-size:13px;color:var(--muted)}
.bar-row{display:grid;grid-template-columns:minmax(110px,170px) 1fr 28px;align-items:center;gap:12px;padding:5px 0;font-size:14px}
.bar-row .lbl{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .trk{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar-row .fill{height:100%;border-radius:4px;background:var(--accent);transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.bar-row .val{text-align:right;font-family:'JetBrains Mono',monospace;color:var(--muted)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cat-row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;padding:12px 8px;border-bottom:1px solid var(--line);border-radius:10px;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;text-align:left;width:100%}
.cat-row:hover{background:var(--surface-2)}
.cat-row:last-child{border-bottom:0}
.cat-row .ico{width:44px;height:44px;border-radius:12px;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center}
.cat-row b{display:block;font-size:15px}
.cat-row span{font-size:13px;color:var(--muted)}
.cat-row em{font-style:normal;font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700}

/* work grid */
.count{color:var(--muted);font-size:15px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .25s,box-shadow .25s,transform .25s;scroll-margin-top:calc(var(--topbar-h) + 16px)}
.card:hover{border-color:var(--accent);box-shadow:0 18px 40px -20px rgba(0,0,0,.8);transform:translateY(-4px)}
.card.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,179,61,.45)}100%{box-shadow:none}}
.thumb{aspect-ratio:16/9;background:var(--surface-2);position:relative;overflow:hidden;display:block;width:100%;padding:0;border:0;cursor:zoom-in;color:inherit}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .4s ease}
.thumb:hover img,.thumb:focus-visible img{transform:scale(1.04)}
.thumb:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.zoom{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(14,17,22,.82);border:1px solid var(--accent);color:var(--accent);display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.85);transition:opacity .2s,transform .2s}
.thumb:hover .zoom,.thumb:focus-visible .zoom,.thumb.video .zoom{opacity:1;transform:none}
.kind{position:absolute;left:12px;top:12px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(14,17,22,.85);color:var(--text-2);border:1px solid var(--line-2)}
.status{position:absolute;right:12px;bottom:12px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(14,17,22,.88);color:var(--text);border:1px solid var(--line-2)}
.status.ok{color:var(--ok);border-color:var(--ok-line)}
.status.warn{color:var(--accent);border-color:var(--warn-line)}
.body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:12px;flex-grow:1}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:#AEB5BF}
.tag.cat{background:var(--accent-bg);color:var(--accent);font-weight:500}
h3{margin:0;font-size:21px;line-height:1.35;font-weight:700}
.desc{margin:0;font-size:15px;line-height:1.7;color:var(--muted);flex-grow:1}
.hl{margin:0;font-size:13px;color:var(--text-2);font-family:'JetBrains Mono',monospace;letter-spacing:.02em}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:4px}
.open{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;background:var(--text);color:var(--bg);text-decoration:none;font-weight:700;font-size:15px}
.open:hover{color:var(--bg);background:#fff}
.open.demo{background:var(--accent);color:var(--on-accent)}
.open.demo:hover{background:var(--accent-hi);color:var(--on-accent)}
.open.repo{background:transparent;color:var(--text-2);border:1px solid var(--line-2);font-weight:500}
.open.repo:hover{color:var(--text);border-color:#6B7585;background:transparent}
.peek{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:transparent;color:var(--text);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:border-color .2s,color .2s}
.peek:hover,.peek:focus-visible,.peek[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.peek svg{transition:transform .25s}
.peek:hover svg{transform:scale(1.15)}

/* quick view */
.qv{position:fixed;z-index:50;width:min(560px,calc(100vw - 32px));max-height:min(640px,calc(100vh - 32px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--accent);border-radius:16px;box-shadow:0 30px 80px -20px rgba(0,0,0,.85);overflow:hidden;opacity:0;transform:translateY(8px) scale(.97);transform-origin:top left;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,.9,.3,1.2)}
.qv.show{opacity:1;transform:none;pointer-events:auto}
.qv.expanded{left:50%!important;top:50%!important;width:min(960px,calc(100vw - 32px));max-height:calc(100vh - 32px);transform:translate(-50%,-50%)}
.qv.expanded:not(.show){transform:translate(-50%,-48%) scale(.97)}
.qv-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex:none}
.qv-title{font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px;min-width:0}
.qv-title #qvTitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qv-badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:500;flex:none}
.qv-tools{display:flex;gap:6px;flex:none}
.qv-tools button,.lb-tools button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line-2);background:transparent;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.qv-tools button:hover,.lb-tools button:hover{border-color:var(--accent);color:var(--accent)}
.qv-scroll{overflow:auto;flex:1;min-height:0}
.qv-stage{background:var(--bg);aspect-ratio:16/10;overflow:hidden;position:relative;border-bottom:1px solid var(--line);display:block;width:100%;padding:0;border-left:0;border-right:0;border-top:0;cursor:zoom-in;color:inherit}
.qv-stage.video{aspect-ratio:16/9;cursor:default}
.qv.expanded .qv-stage:not(.video){aspect-ratio:auto}
.qv-stage img{width:100%;display:block}
.qv:not(.expanded) .qv-stage img{height:100%;object-fit:cover;object-position:top}
.qv-stage.video img{height:100%;object-fit:cover}
.qv-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.playbadge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none}
.playbadge span{width:64px;height:64px;border-radius:50%;background:rgba(14,17,22,.8);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center}
.qv-detail{padding:18px 20px;display:grid;gap:14px}
.qv.expanded .qv-detail{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px 28px;padding:24px}
.qv-detail h4{margin:0 0 4px;font-size:12px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;color:var(--accent);font-weight:500}
.qv-detail p{margin:0;font-size:14px;line-height:1.7;color:var(--text-2)}
.qv-detail .note{grid-column:1/-1;background:var(--accent-bg);border-radius:12px;padding:14px 16px}
.qv-detail .note p{color:var(--text)}
.toolchips{display:flex;flex-wrap:wrap;gap:6px}
.toolchips span{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--text-2)}
.qv-foot{padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;border-top:1px solid var(--line);flex:none}
.qv-links{display:flex;flex-wrap:wrap;gap:8px}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,7,10,.7);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}

/* lightbox (enlarged screenshot) */
.lb{position:fixed;inset:0;z-index:60;background:rgba(5,7,10,.94);display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .2s}
.lb.show{opacity:1;pointer-events:auto}
.lb-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;flex:none}
.lb-cap{min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-weight:700}
.lb-cap span{font-size:12px;font-weight:500;color:var(--muted);padding:2px 8px;border-radius:999px;background:var(--surface-2)}
.lb-tools{display:flex;gap:6px;flex:none}
.lb-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 72px 24px;position:relative}
.lb-stage img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 30px 80px -20px rgba(0,0,0,.9);background:var(--surface)}
.lb-stage .frame{width:min(1100px,100%);aspect-ratio:16/9;position:relative}
.lb-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:10px}
.lb-nav{position:absolute;top:50%;margin-top:-26px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb-nav:hover{border-color:var(--accent);color:var(--accent)}
.lb-prev{left:12px}.lb-next{right:12px}
.lb-foot{flex:none;text-align:center;padding:0 0 16px;font-size:13px;color:var(--faint)}

/* AI partners */
.agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px;position:relative}
.agent{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.agent.current{border-color:var(--accent)}
.agent-top{display:flex;align-items:center;gap:16px}
.avatar{width:64px;height:64px;border-radius:18px;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.agent.retired .avatar{background:var(--surface-2);color:var(--muted)}
.agent h3{font-size:24px}
.agent h3 small{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-top:2px;font-family:'Space Grotesk',sans-serif}
.gen{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;color:var(--accent)}
.agent p{margin:0;font-size:15px;line-height:1.75;color:var(--text-2)}
.agent .facts{display:flex;flex-wrap:wrap;gap:8px}

    var q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    try { var s = localStorage.getItem('pf-lang'); if (s === 'zh' || s === 'en') return s; } catch (e) {}
    var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
    for (var i = 0; i < list.length; i++) {
      var x = String(list[i]).toLowerCase();
      if (x.indexOf('zh') === 0) return 'zh';
      if (x.indexOf('en') === 0) return 'en';
    }
    return 'en';
  }

  var state = { lang: detectLang(), cat: 'all' };
  var $ = function (id) { return document.getElementById(id); };
  var icon = {
    arrow: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg>',
    code: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 18l6-6-6-6"/><path d="M8 6l-6 6 6 6"/></svg>',
    play: '<svg width="22" height="22" viewBox="0 0 24 24" fill="#F2B33D" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
    playSm: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
    zoom: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/><path d="M11 8v6"/><path d="M8 11h6"/></svg>',
    eye: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
    caret: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>'
  };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function t() { return T[state.lang]; }
  function f(w, key) { var v = state.lang === 'en' ? w[key + '_en'] : w[key]; return v || w[key] || ''; }
  function statusText(w) { return t().status[w.status] || w.status; }
  function linkHtml(l) {
    var label = l.type === 'repo' ? icon.code + esc(t().repo) : l.type === 'video' ? icon.playSm + esc(t().video) : esc(t().demo) + icon.arrow;
    return '<a class="open ' + l.type + '" href="' + esc(l.url) + '" target="_blank" rel="noopener">' + label + '</a>';
  }
  function fillI18n(root) {
    root.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t()[el.getAttribute('data-i18n')]; });
  }
  function visible() { return works.filter(function (w) { return state.cat === 'all' || w.category === state.cat; }); }
  function topbarH() { return $('topbar').offsetHeight; }

  /* ---------- category bar, tree menu, filtering ---------- */
  function setCat(k, scroll) {
    state.cat = k;
    renderChips(); renderGrid();
    if (scroll) $('works').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function renderChips() {
    var el = $('chips');
    el.setAttribute('aria-label', t().filterLabel);
    el.innerHTML = '';
    ['all'].concat(CAT_ORDER).forEach(function (k) {
      var n = k === 'all' ? works.length : works.filter(function (w) { return w.category === k; }).length;
      var b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = esc(k === 'all' ? t().all : t().cat[k]) + '<span>' + n + '</span>';
      b.setAttribute('aria-pressed', String(k === state.cat));
      b.addEventListener('click', function () { setCat(k, true); });
      el.appendChild(b);
    });
  }
  var treeOpen = {};
  function renderTree() {
    var body = $('treeBody'); body.innerHTML = '';
    CAT_ORDER.forEach(function (c) {
      var list = works.filter(function (w) { return w.category === c; });
      var node = document.createElement('div');
      node.className = 'tnode' + (treeOpen[c] ? ' is-open' : '');
      node.innerHTML =
        '<div class="tnode-row"><button type="button" class="caret" aria-expanded="' + !!treeOpen[c] + '" aria-label="' + esc(t().cat[c]) + '">' + icon.caret + '</button>' +
        '<button type="button" class="tcat"><span class="ico">' + catSvg(c, 18) + '</span>' + esc(t().cat[c]) + '<em>' + list.length + '</em></button></div>' +
        '<ul class="tkids">' + list.map(function (w) {
          return '<li><button type="button" data-id="' + w.id + '"><span class="dot ' + tone(w.status) + '"></span>' + esc(f(w, 'name')) + '</button></li>';
        }).join('') + '</ul>';
      node.querySelector('.caret').addEventListener('click', function () {
        treeOpen[c] = !treeOpen[c]; node.classList.toggle('is-open', treeOpen[c]); this.setAttribute('aria-expanded', String(treeOpen[c])); syncToggleAll();
      });
      node.querySelector('.tcat').addEventListener('click', function () { closeTree(); setCat(c, true); });
      node.querySelectorAll('.tkids button').forEach(function (b) {
        b.addEventListener('click', function () { closeTree(); goToWork(b.getAttribute('data-id')); });
      });
      body.appendChild(node);
    });
    syncToggleAll();
  }
  function syncToggleAll() {
    var all = CAT_ORDER.every(function (c) { return treeOpen[c]; });
    $('treeToggleAll').textContent = all ? t().collapseAll : t().expandAll;
  }
  $('treeToggleAll').addEventListener('click', function () {
    var all = CAT_ORDER.every(function (c) { return treeOpen[c]; });
    CAT_ORDER.forEach(function (c) { treeOpen[c] = !all; });
    renderTree();
  });
  function goToWork(id) {
    var w = works.filter(function (x) { return x.id === id; })[0];
    if (!w) return;
    if (state.cat !== 'all' && state.cat !== w.category) setCat(w.category, false);
    var card = $('work-' + id);
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
  }
  function openTree() { $('tree').classList.add('show'); $('menuBtn').setAttribute('aria-expanded', 'true'); var first = $('treeBody').querySelector('button'); if (first) first.focus(); }
  function closeTree() { $('tree').classList.remove('show'); $('menuBtn').setAttribute('aria-expanded', 'false'); }
  $('menuBtn').addEventListener('click', function () { $('tree').classList.contains('show') ? closeTree() : openTree(); });
  document.addEventListener('click', function (e) {
    if ($('tree').classList.contains('show') && !$('tree').contains(e.target) && !$('menuBtn').contains(e.target)) closeTree();
  });

  /* ---------- sections ---------- */
  function renderStats() {
    var tools = {}; works.forEach(function (w) { (w.tools || []).forEach(function (x) { tools[x] = 1; }); });
    var items = [
      [works.length, t().statWorks],
      [works.filter(function (w) { return tone(w.status) === 'ok'; }).length, t().statDone],
      [Object.keys(tools).length, t().statTools],
      [works.filter(function (w) { return w.links.length; }).length, t().statLive]
    ];
    $('stats').innerHTML = items.map(function (x) { return '<div class="stat"><b>' + x[0] + '</b><span>' + esc(x[1]) + '</span></div>'; }).join('');
  }
  function renderSkills() {
    var m = {};
    works.forEach(function (w) { (w.tools || []).forEach(function (x) { m[x] = (m[x] || 0) + 1; }); });
    var top = Object.keys(m).map(function (k) { return [k, m[k]]; })
      .sort(function (a, b) { return b[1] - a[1] || a[0].localeCompare(b[0]); }).slice(0, 12);
    var max = top.length ? top[0][1] : 1;
    $('toolBars').innerHTML = top.map(function (x, i) {
      return '<div class="bar-row"><span class="lbl" title="' + esc(x[0]) + '">' + esc(x[0]) + '</span><div class="trk"><div class="fill" style="width:' + (x[1] / max * 100) + '%;animation-delay:' + (i * 40) + 'ms"></div></div><span class="val">' + x[1] + '</span></div>';
    }).join('');
    var list = $('catList'); list.innerHTML = '';
    CAT_ORDER.forEach(function (c) {
      var n = works.filter(function (w) { return w.category === c; }).length;
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'cat-row';
      b.innerHTML = '<span class="ico">' + catSvg(c, 22) + '</span><div><b>' + esc(t().cat[c]) + '</b><span>' + esc(t().catDesc[c]) + '</span></div><em>' + n + '</em>';
      b.addEventListener('click', function () { setCat(c, true); });
      list.appendChild(b);
    });
  }

  function renderGrid() {
    var g = $('grid'); g.innerHTML = '';
    var list = visible();
    $('count').textContent = t().count(works.length, list.length);
    list.forEach(function (w) {
      var el = document.createElement('article');
      el.className = 'card';
      el.id = 'work-' + w.id;
      var thumb = '';
      if (w.snap) {
        thumb = '<button type="button" class="thumb' + (w.snap.type === 'video' ? ' video' : '') + '" aria-label="' + esc(t().zoomIn + (state.lang === 'zh' ? '：' : ': ') + f(w, 'name')) + '">' +
          '<img src="' + w.snap.src + '" alt="" loading="lazy">' +
          '<span class="zoom">' + (w.snap.type === 'video' ? icon.play : icon.zoom) + '</span>' +
          '<span class="kind">' + esc(t()[w.snap.kind]) + '</span>' +
          '<span class="status ' + tone(w.status) + '">' + esc(statusText(w)) + '</span></button>';
      }
      el.innerHTML = thumb +
        '<div class="body">' +
          '<div class="tags"><span class="tag cat">' + esc(t().cat[w.category]) + '</span></div>' +
          '<h3>' + esc(f(w, 'name')) + '</h3><p class="desc">' + esc(f(w, 'summary')) + '</p>' +
          (f(w, 'highlight') ? '<p class="hl">' + esc(f(w, 'highlight')) + '</p>' : '') +
          '<div class="actions">' + w.links.map(linkHtml).join('') +
            '<button type="button" class="peek" aria-haspopup="dialog" aria-expanded="false" aria-controls="qv">' + icon.eye + esc(t().peek) + '</button>' +
          '</div>' +
        '</div>';
      var th = el.querySelector('.thumb');
      if (th) th.addEventListener('click', function () { openLB(w.id, th); });
      var peek = el.querySelector('.peek');
      peek.addEventListener('mouseenter', function () { hoverOpen(w, peek); });
      peek.addEventListener('mouseleave', scheduleClose);
      peek.addEventListener('focus', function () { if (!qv.classList.contains('expanded')) openQV(w, peek, false); });
      peek.addEventListener('blur', scheduleClose);
      peek.addEventListener('click', function () { openQV(w, peek, true); });
      g.appendChild(el);
    });
  }

  /* ---------- lightbox: enlarged screenshot / video ---------- */
  var lb = $('lb'), lbId = null, lbReturn = null;
  function lbList() { return visible().filter(function (w) { return w.snap; }); }
  function renderLB() {
    var w = works.filter(function (x) { return x.id === lbId; })[0];
    if (!w) return;
    $('lbTitle').textContent = f(w, 'name');
    $('lbKind').textContent = t()[w.snap.kind];
    var stage = $('lbStage'); stage.innerHTML = '';
    if (w.snap.type === 'video') {
      var fr = document.createElement('div'); fr.className = 'frame';
      fr.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + w.snap.id + '?rel=0" title="' + esc(f(w, 'name')) + '" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>';
      stage.appendChild(fr);
    } else {
      var img = new Image(); img.src = w.snap.src; img.alt = f(w, 'name') + ' · ' + t()[w.snap.kind]; stage.appendChild(img);
    }
    var many = lbList().length > 1;
    $('lbPrev').hidden = !many; $('lbNext').hidden = !many;
    $('lbPrev').setAttribute('aria-label', t().prev); $('lbNext').setAttribute('aria-label', t().next);
    $('lbClose').setAttribute('aria-label', t().close);
    $('lbFoot').textContent = t().lbFoot;
  }
  function openLB(id, from) {
    if (qv.classList.contains('show')) closeQV();
    lbId = id; lbReturn = from || null;
    lb.hidden = false; renderLB();
    requestAnimationFrame(function () { lb.classList.add('show'); });
    document.body.style.overflow = 'hidden';
    $('lbClose').focus();
  }
  function closeLB() {
    lb.classList.remove('show');
    document.body.style.overflow = '';
    setTimeout(function () { if (!lb.classList.contains('show')) { lb.hidden = true; $('lbStage').innerHTML = ''; } }, 220);
    if (lbReturn && document.contains(lbReturn)) lbReturn.focus();
    lbId = null;
  }
  function stepLB(d) {
    var list = lbList(); if (list.length < 2) return;
    var i = list.map(function (w) { return w.id; }).indexOf(lbId);
    lbId = list[(i + d + list.length) % list.length].id;
    lbReturn = document.querySelector('#work-' + lbId + ' .thumb');
    renderLB();
  }
  $('lbClose').addEventListener('click', closeLB);
  $('lbPrev').addEventListener('click', function () { stepLB(-1); });
  $('lbNext').addEventListener('click', function () { stepLB(1); });
  $('lbStage').addEventListener('click', function (e) { if (e.target === this) closeLB(); });

  /* ---------- quick view ---------- */
  var qv = $('qv'), scrim = $('scrim');
  var current = null, anchor = null, openTimer = null, closeTimer = null, quietUntil = 0;

  // Put the preview above or below its button, shrinking it to fit, and never over the button itself.
  function place(btn) {
    var GAP = 12, M = 16, TOP = topbarH() + 8;
    var r = btn.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
    qv.style.maxHeight = '';
    var w = qv.offsetWidth, h = qv.offsetHeight;
    var above = r.top - GAP - TOP, below = vh - r.bottom - GAP - M;
    var left = Math.min(Math.max(M, r.left), vw - w - M), top;
    if (h <= above) top = r.top - GAP - h;
    else if (h <= below) top = r.bottom + GAP;
    else if (Math.max(above, below) >= 280) {
      var up = above >= below;
      qv.style.maxHeight = (up ? above : below) + 'px';
      h = qv.offsetHeight;
      top = up ? r.top - GAP - h : r.bottom + GAP;
    } else {
      // Too little room above and below: sit beside the button.
      left = r.right + GAP + w <= vw - M ? r.right + GAP : Math.max(M, r.left - GAP - w);
      top = Math.min(Math.max(TOP, r.top + r.height / 2 - h / 2), vh - h - M);
    }
    qv.style.left = left + 'px'; qv.style.top = top + 'px';
  }
  function section(title, text) { return text ? '<div><h4>' + esc(title) + '</h4><p>' + esc(text) + '</p></div>' : ''; }
  function renderStage(w) {
    var stage = $('qvStage'); stage.innerHTML = ''; stage.className = 'qv-stage';
    stage.hidden = !w.snap;
    stage.onclick = null;
    if (!w.snap) return;
    if (w.snap.type === 'img') {
      var img = new Image(); img.src = w.snap.src; img.alt = f(w, 'name'); stage.appendChild(img);
      stage.onclick = function () { openLB(w.id, document.querySelector('#work-' + w.id + ' .thumb')); };
    } else {
      stage.classList.add('video');
      if (qv.classList.contains('expanded')) {
        stage.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + w.snap.id + '?rel=0" title="' + esc(f(w, 'name')) + '" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>';
      } else {
        stage.innerHTML = '<img src="' + w.snap.src + '" alt="' + esc(f(w, 'name')) + '"><span class="playbadge"><span>' + icon.play + '</span></span>';
      }
    }
  }
  function fillQV(w) {
    $('qvTitle').textContent = f(w, 'name');
    var kind = w.snap ? w.snap.kind : 'info';
    $('qvBadge').textContent = t()[kind];
    $('qvNote').textContent = kind === 'real' ? t().noteReal : kind === 'illustration' ? t().noteIll : kind === 'vid' ? t().noteVid : statusText(w);
    renderStage(w);
    var tools = (w.tools || []).map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('');
    $('qvDetail').innerHTML =
      section(t().hPain, f(w, 'pain_point')) + section(t().hSol, f(w, 'solution')) +
      section(t().hAI, f(w, 'ai_role')) + section(t().hHi, f(w, 'highlight')) +
      (tools ? '<div><h4>' + esc(t().hTools) + '</h4><div class="toolchips">' + tools + '</div></div>' : '') +
      (f(w, 'my_note') ? '<div class="note"><h4>' + esc(t().hNote) + '</h4><p>' + esc(f(w, 'my_note')) + '</p></div>' : '');
    $('qvLinks').innerHTML = w.links.map(linkHtml).join('');
    $('qvClose').setAttribute('aria-label', t().close);
    syncExpandBtn();
  }
  function syncExpandBtn() { $('qvExpand').setAttribute('aria-label', qv.classList.contains('expanded') ? t().shrink : t().expand); }
  function setExpanded(on) {
    if (on) qv.style.maxHeight = '';
    var changed = qv.classList.contains('expanded') !== on;
    qv.classList.toggle('expanded', on);
    scrim.classList.toggle('show', on);
    qv.setAttribute('aria-modal', String(on));
    syncExpandBtn();
    if (changed && current && current.snap && current.snap.type === 'video') renderStage(current);
    if (!on && anchor && qv.classList.contains('show')) place(anchor);
  }
  function openQV(w, btn, expand) {
    clearTimeout(closeTimer); clearTimeout(openTimer);
    if (anchor && anchor !== btn) anchor.setAttribute('aria-expanded', 'false');
    current = w; anchor = btn;
    fillQV(w);
    qv.querySelector('.qv-scroll').scrollTop = 0;
    btn.setAttribute('aria-expanded', 'true');
    if (expand) setExpanded(true);
    else if (!qv.classList.contains('expanded')) place(btn);
    qv.classList.add('show');
    if (expand) $('qvClose').focus();
  }
  function hoverOpen(w, btn) {
    if (qv.classList.contains('expanded') || Date.now() < quietUntil) return;
    clearTimeout(closeTimer); clearTimeout(openTimer);
    openTimer = setTimeout(function () { openQV(w, btn, false); }, 120);
  }
  function closeQV() {
    clearTimeout(openTimer); clearTimeout(closeTimer);
    qv.classList.remove('show');
    if (anchor) anchor.setAttribute('aria-expanded', 'false');
    var back = qv.classList.contains('expanded') ? anchor : null;
    if (back) quietUntil = Date.now() + 600; // the pointer may still rest on the button: don't pop the preview straight back
    setTimeout(function () {
      if (!qv.classList.contains('show')) { setExpanded(false); $('qvStage').innerHTML = ''; }
    }, 220);
    scrim.classList.remove('show');
    if (back) back.focus();
    current = null;
  }
  function scheduleClose() {
    clearTimeout(openTimer);
    if (qv.classList.contains('expanded')) return;
    closeTimer = setTimeout(function () {
      if (!qv.matches(':hover') && !qv.contains(document.activeElement) && !(anchor && anchor.matches(':hover'))) closeQV();
    }, 220);
  }
  qv.addEventListener('mouseenter', function () { clearTimeout(closeTimer); });
  qv.addEventListener('mouseleave', scheduleClose);
  $('qvClose').addEventListener('click', closeQV);
  $('qvExpand').addEventListener('click', function () { setExpanded(!qv.classList.contains('expanded')); });
  scrim.addEventListener('click', closeQV);
  window.addEventListener('resize', function () { if (anchor && qv.classList.contains('show') && !qv.classList.contains('expanded')) place(anchor); });
  window.addEventListener('scroll', function () { if (qv.classList.contains('show') && !qv.classList.contains('expanded')) closeQV(); }, { passive: true });

  document.addEventListener('keydown', function (e) {
    if (!lb.hidden && lb.classList.contains('show')) {
      if (e.key === 'Escape') closeLB();
      else if (e.key === 'ArrowLeft') stepLB(-1);
      else if (e.key === 'ArrowRight') stepLB(1);
      return;
    }
    if (e.key === 'Escape') {
      if ($('tree').classList.contains('show')) { closeTree(); $('menuBtn').focus(); }
      else if (qv.classList.contains('show')) closeQV();
    }
  });

  /* ---------- language ---------- */
  function renderAll() {
    document.documentElement.lang = state.lang === 'zh' ? 'zh-Hant-TW' : 'en';
    document.documentElement.setAttribute('data-lang', state.lang);
    document.title = t().title;
    $('langBtn').setAttribute('aria-label', t().toggleLabel);
    fillI18n(document);
    renderStats(); renderSkills(); renderChips(); renderTree(); renderGrid();
    if (lbId) renderLB();
    document.documentElement.style.setProperty('--topbar-h', topbarH() + 'px');
  }
  $('langBtn').addEventListener('click', function () {
    state.lang = state.lang === 'zh' ? 'en' : 'zh';
    try { localStorage.setItem('pf-lang', state.lang); } catch (e) {}
    if (qv.classList.contains('show')) closeQV();
    renderAll();
    var btn = $('langBtn'), main = $('main');
    btn.classList.remove('spin'); main.classList.remove('pop');
    void btn.offsetWidth;
    btn.classList.add('spin'); main.classList.add('pop');
  });
  window.addEventListener('resize', function () { document.documentElement.style.setProperty('--topbar-h', topbarH() + 'px'); });

  renderAll();
})();
</script>
</body>
</html>
