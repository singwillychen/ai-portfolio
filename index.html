(function(){const calcs={},draws={};const src={works:window.__WORKS};
window.dash={colors:['var(--c0)','var(--c1)'],
calc:(id,o)=>{calcs[id]=o},
data:(id)=>{if(src[id])return{status:'ok',data:src[id]};const c=calcs[id];return{status:'ok',data:c.fn(...c.inputs.map(i=>window.dash.data(i).data))}},
draw:(n,fn)=>{if(fn){draws[n]=fn;return}document.querySelectorAll('[data-draw="'+n+'"]').forEach(el=>draws[n](el))},
_run:()=>Object.keys(draws).forEach(n=>window.dash.draw(n))};})();
</script><script>
window.pfTools = (w) => { const t = w.tools; if (Array.isArray(t)) return t; if (typeof t === 'string') { try { const a = JSON.parse(t); return Array.isArray(a) ? a : []; } catch (e) { return []; } } return []; };

dash.calc('totals', {
  title: '作品總覽數字',
  description: '作品數、狀態為已完成或使用中的作品數，以及所有作品用到的不重複工具數。',
  inputs: ['works'],
  fn: (works) => [{
    works: works.length,
    done: works.filter((w) => w.status === '已完成' || w.status === '使用中').length,
    tools: new Set(works.flatMap((w) => ((t) => Array.isArray(t) ? t : (typeof t === 'string' && t.trim().startsWith('[') ? JSON.parse(t) : []))(w.tools))).size
  }]
});

dash.calc('tool_counts', {
  title: '工具使用次數',
  description: '每個工具出現在幾個作品中，依次數排序取前 10 名。',
  inputs: ['works'],
  fn: (works) => {
    const m = new Map();
    works.forEach((w) => ((t) => Array.isArray(t) ? t : (typeof t === 'string' && t.trim().startsWith('[') ? JSON.parse(t) : []))(w.tools).forEach((t) => m.set(t, (m.get(t) || 0) + 1)));
    return [...m].map(([tool, n]) => ({tool, n})).sort((a, b) => b.n - a.n || a.tool.localeCompare(b.tool)).slice(0, 10);
  }
});

dash.calc('status_counts', {
  title: '作品狀態分布',
  description: '依狀態（已完成、使用中、MVP、開發中、訓練中、文件）計算作品數。',
  inputs: ['works'],
  fn: (works) => {
    const order = ['已完成', '使用中', 'MVP', '開發中', '訓練中', '文件'];
    const m = new Map();
    works.forEach((w) => m.set(w.status, (m.get(w.status) || 0) + 1));
    return [...m].map(([status, n]) => ({status, n})).sort((a, b) => order.indexOf(a.status) - order.indexOf(b.status));
  }
});

window.pfCat = '';
window.pfTone = (s) => (s === '已完成' || s === '使用中') ? 'ok' : (s === '文件' ? 'muted' : 'warn');

const pfFail = (el) => { el.replaceChildren(); const d = document.createElement('div'); d.className = 'pf-fail'; d.textContent = '載入失敗'; el.appendChild(d); };

['works', 'done', 'tools'].forEach((f) => {
  dash.draw('n-' + f, (el) => {
    const r = dash.data('totals');
    if (r.status === 'ok' && r.data.length) { el.classList.remove('dash-skeleton'); el.textContent = d3.format(',')(r.data[0][f]); }
    else { if (r.status === 'error') el.classList.remove('dash-skeleton'); el.textContent = '—'; }
  });
});

const pfBars = (id, key, colorFn) => (el) => {
  const r = dash.data(id);
  if (r.status !== 'ok') { if (r.status === 'error') { el.classList.remove('dash-skeleton'); pfFail(el); } else el.replaceChildren(); return; }
  el.classList.remove('dash-skeleton');
  el.replaceChildren();
  const max = d3.max(r.data, (d) => d.n) || 1;
  const tip = document.createElement('div'); tip.className = 'pf-tip'; tip.hidden = true;
  r.data.forEach((d, i) => {
    const row = document.createElement('div'); row.className = 'pf-bar-row';
    const lab = document.createElement('span'); lab.className = 'pf-bar-label'; lab.textContent = d[key];
    const track = document.createElement('div'); track.className = 'pf-bar-track';
    const fill = document.createElement('div'); fill.className = 'pf-bar-fill';
    fill.style.width = (d.n / max * 100) + '%';
    fill.style.background = colorFn(d, i);
    track.appendChild(fill);
    const val = document.createElement('span'); val.className = 'pf-bar-val'; val.textContent = d3.format(',')(d.n);
    row.append(lab, track, val);
    row.addEventListener('mousemove', (e) => {
      tip.textContent = d[key] + '：' + d.n + ' 個作品';
      tip.hidden = false;
      const box = el.getBoundingClientRect();
      const x = Math.min(e.clientX - box.left + 12, box.width - tip.offsetWidth);
      tip.style.left = Math.max(0, x) + 'px';
      tip.style.top = (e.clientY - box.top - 30) + 'px';
    });
    row.addEventListener('mouseleave', () => { tip.hidden = true; });
    el.appendChild(row);
  });
  el.appendChild(tip);
};

dash.draw('tool-bars', pfBars('tool_counts', 'tool', (d, i) => i === 0 ? dash.colors[0] : 'var(--cds-chart-muted)'));
dash.draw('status-bars', pfBars('status_counts', 'status', (d) => window.pfTone(d.status) === 'ok' ? dash.colors[0] : (window.pfTone(d.status) === 'warn' ? dash.colors[1] : 'var(--cds-chart-muted)')));

let pfAnimated = false;
dash.draw('cards', (el) => {
  const r = dash.data('works');
  if (r.status !== 'ok') { if (r.status === 'error') { el.classList.remove('dash-skeleton'); pfFail(el); } else el.replaceChildren(); return; }
  el.classList.remove('dash-skeleton');
  el.replaceChildren();
  const mk = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const rows = r.data.slice().sort((a, b) => Number(a.order) - Number(b.order)).filter((w) => !window.pfCat || w.category === window.pfCat);
  rows.forEach((w, i) => {
    const card = mk('article', 'pf-card'); card.id = 'work-' + w.id;
    if (!pfAnimated) { card.classList.add('in'); card.style.animationDelay = (i * 40) + 'ms'; }
    const top = mk('div', 'pf-card-top');
    const t = mk('div');
    t.append(mk('p', 'pf-card-cat', w.category), mk('h3', 'pf-card-name', w.name));
    top.append(t, mk('span', 'pf-pill ' + window.pfTone(w.status), w.status));
    card.append(top, mk('p', 'pf-summary', w.summary));
    if (w.highlight) card.append(mk('div', 'pf-highlight', w.highlight));
    [['解決的痛點', w.pain_point], ['怎麼做', w.solution], ['AI 在其中的角色', w.ai_role]].forEach(([h, txt]) => {
      if (!txt) return;
      const b = mk('div', 'pf-block'); b.append(mk('h4', null, h), mk('p', null, txt)); card.append(b);
    });
    const tb = mk('div', 'pf-block'); tb.append(mk('h4', null, '使用與串接的工具'));
    const chips = mk('div', 'pf-chips'); window.pfTools(w).forEach((x) => chips.append(mk('span', 'pf-chip', x)));
    tb.append(chips); card.append(tb);
    const mine = mk('div', 'pf-mine'); mine.append(mk('h4', null, '我的說明'));
    mine.append(w.my_note ? mk('p', null, w.my_note) : mk('p', 'empty', '尚未填寫：可補充動機、你負責的部分、實際成效或心得。'));
    card.append(mine);
    el.appendChild(card);
  });
  if (rows.length) pfAnimated = true;
});

document.querySelectorAll('.pf-filter button').forEach((btn) => {
  btn.addEventListener('click', () => {
    window.pfCat = btn.dataset.cat || '';
    document.querySelectorAll('.pf-filter button').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
    dash.draw('cards');
  });
});

window.dash._run();</script></body></html>
