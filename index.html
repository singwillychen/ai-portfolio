<!doctype html>
<html lang="zh-Hant-TW" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>陳威廷｜AI 應用作品集</title>
<meta name="description" content="Willy (Chen Wei-Ting) · AI Application Portfolio — 18 projects built with Claude Code and other AI tools. 陳威廷 AI 應用作品集。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1116; --surface:#161B22; --surface-2:#1E2530; --line:#232933; --line-2:#3A4250;
  --text:#E8EAED; --text-2:#C9CED6; --muted:#9AA3AF; --faint:#8A93A0; --ghost:#2C3442;
  --accent:#F2B33D; --accent-hi:#FFD27A; --accent-bg:#2A2414; --on-accent:#0E1116;
  --ok:#7FD99A; --ok-line:#2F5A3D; --warn-line:#5A4718;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans TC','Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}a:hover{color:var(--accent-hi)}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.mono{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);letter-spacing:.12em}

/* header */
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;padding:24px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px;letter-spacing:.02em;color:var(--text);text-decoration:none}
.brand:hover{color:var(--text)}
.logo{width:36px;height:36px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
nav a{color:var(--text-2);text-decoration:none;padding:12px 14px;font-size:15px}
nav a:hover{color:var(--text)}
nav a.pill{color:var(--bg);background:var(--text);padding:12px 18px;border-radius:999px;font-weight:500}

/* language toggle */
.lang-toggle{margin-left:4px;min-height:44px;display:inline-flex;align-items:center;gap:10px;padding:0 6px 0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-family:'Space Grotesk',sans-serif;cursor:pointer;transition:border-color .2s}
.lang-toggle:hover{border-color:#6B7585}
.lang-toggle:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.globe{display:inline-flex;transition:transform .3s}
.lang-toggle:hover .globe{transform:rotate(-14deg)}
.track{position:relative;display:grid;grid-template-columns:1fr 1fr;width:84px;height:32px;border-radius:999px;background:var(--bg);font-size:13px;font-weight:700}
.track .knob{position:absolute;top:3px;left:3px;width:39px;height:26px;border-radius:999px;background:var(--accent);transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
html[data-lang="en"] .track .knob{transform:translateX(39px)}
.track .lbl{position:relative;display:flex;align-items:center;justify-content:center;color:var(--faint);transition:color .3s}
html[data-lang="zh"] .track .lbl-zh,html[data-lang="en"] .track .lbl-en{color:var(--on-accent)}
.spin svg{animation:spin .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes spin{50%{transform:rotate(200deg) scale(1.25)}to{transform:rotate(360deg)}}
.pop{animation:pop .45s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* hero */
.hero{padding:88px 0 64px;display:flex;flex-direction:column;gap:24px}
h1{margin:0;font-size:clamp(40px,6vw,72px);line-height:1.1;font-weight:900;letter-spacing:-.01em}
.role{margin:0;font-size:clamp(18px,2.2vw,24px);font-weight:500;color:var(--text-2)}
.role b{color:var(--accent);font-weight:700}
.lead{margin:0;max-width:720px;font-size:18px;line-height:1.75;color:var(--muted)}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 22px;border-radius:999px;text-decoration:none;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer;border:0}
.btn-accent{background:var(--accent);color:var(--on-accent)}
.btn-accent:hover{color:var(--on-accent);background:var(--accent-hi)}
.btn-ghost{border:1px solid var(--line-2);color:var(--text);background:transparent;font-weight:500}
.btn-ghost:hover{color:var(--text);border-color:#6B7585}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.stat b{display:block;font-family:'Space Grotesk',sans-serif;font-size:40px;line-height:1;color:var(--text)}
.stat span{display:block;margin-top:8px;font-size:14px;color:var(--muted)}

/* sections */
section{padding:72px 0;border-top:1px solid var(--line)}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:32px}
h2{margin:0;font-size:34px;font-weight:700}
.sec-sub{margin:8px 0 0;color:var(--muted);font-size:15px}

/* skills */
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
.panel h3{margin:0;font-size:18px}
.panel .note{margin:6px 0 20px;font-size:13px;color:var(--muted)}
.bar-row{display:grid;grid-template-columns:minmax(110px,170px) 1fr 28px;align-items:center;gap:12px;padding:5px 0;font-size:14px}
.bar-row .lbl{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .trk{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar-row .fill{height:100%;border-radius:4px;background:var(--accent);transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.bar-row .val{text-align:right;font-family:'JetBrains Mono',monospace;color:var(--muted)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cat-row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.cat-row:last-child{border-bottom:0}
.cat-row .ico{width:44px;height:44px;border-radius:12px;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center}
.cat-row b{display:block;font-size:15px}
.cat-row span{font-size:13px;color:var(--muted)}
.cat-row em{font-style:normal;font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700}

/* work grid */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--text-2);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer}
.filters button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700}
.filters button span{opacity:.7;margin-left:6px;font-size:13px}
.count{color:var(--muted);font-size:15px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .25s,box-shadow .25s,transform .25s}
.card:hover{border-color:var(--accent);box-shadow:0 18px 40px -20px rgba(0,0,0,.8);transform:translateY(-4px)}
.thumb{aspect-ratio:16/9;background:var(--surface-2);position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.thumb .num{position:absolute;left:20px;bottom:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:72px;line-height:1;color:var(--ghost)}
.thumb .cat-ico{position:absolute;right:20px;top:20px;color:var(--accent);opacity:.85}
.thumb .mini{position:absolute;inset:0;transform:scale(.62);transform-origin:top left;width:161%;height:161%;pointer-events:none}
.thumb .playbadge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.thumb .playbadge span{width:56px;height:56px;border-radius:50%;background:rgba(14,17,22,.8);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center}
.status{position:absolute;right:12px;bottom:12px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(14,17,22,.88);color:var(--text);border:1px solid var(--line-2)}
.status.ok{color:var(--ok);border-color:var(--ok-line)}
.status.warn{color:var(--accent);border-color:var(--warn-line)}
.body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:12px;flex-grow:1}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:#AEB5BF}
.tag.cat{background:var(--accent-bg);color:var(--accent);font-weight:500}
h3{margin:0;font-size:21px;line-height:1.35;font-weight:700}
.desc{margin:0;font-size:15px;line-height:1.7;color:var(--muted);flex-grow:1}
.hl{margin:0;font-size:13px;color:var(--text-2);font-family:'JetBrains Mono',monospace;letter-spacing:.02em}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:4px}
.open{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;background:var(--text);color:var(--bg);text-decoration:none;font-weight:700;font-size:15px}
.open:hover{color:var(--bg);background:#fff}
.open.repo{background:transparent;color:var(--text-2);border:1px solid var(--line-2);font-weight:500}
.open.repo:hover{color:var(--text);border-color:#6B7585;background:transparent}
.peek{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:transparent;color:var(--text);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:border-color .2s,color .2s}
.peek:hover,.peek:focus-visible,.peek[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.peek svg{transition:transform .25s}
.peek:hover svg{transform:scale(1.15)}

/* quick view */
.qv{position:fixed;z-index:50;width:min(560px,calc(100vw - 32px));max-height:min(640px,calc(100vh - 32px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--accent);border-radius:16px;box-shadow:0 30px 80px -20px rgba(0,0,0,.85);overflow:hidden;opacity:0;transform:translateY(8px) scale(.97);transform-origin:top left;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,.9,.3,1.2)}
.qv.show{opacity:1;transform:none;pointer-events:auto}
.qv.expanded{left:50%!important;top:50%!important;width:min(960px,calc(100vw - 32px));max-height:calc(100vh - 32px);transform:translate(-50%,-50%)}
.qv.expanded:not(.show){transform:translate(-50%,-48%) scale(.97)}
.qv-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex:none}
.qv-title{font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px;min-width:0}
.qv-title #qvTitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qv-badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:500;flex:none}
.qv-tools{display:flex;gap:6px;flex:none}
.qv-tools button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line-2);background:transparent;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.qv-tools button:hover{border-color:var(--accent);color:var(--accent)}
.qv-scroll{overflow:auto;flex:1;min-height:0}
.qv-stage{background:var(--bg);aspect-ratio:16/10;overflow:hidden;position:relative;border-bottom:1px solid var(--line)}
.qv-stage[hidden]{display:none}
.qv-stage.video{aspect-ratio:16/9}
.qv.expanded .qv-stage:not(.video){aspect-ratio:auto}
.qv-stage img{width:100%;display:block}
.qv:not(.expanded) .qv-stage img{height:100%;object-fit:cover;object-position:top}
.qv-stage.video img{height:100%;object-fit:cover}
.qv-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.qv-stage .playbadge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none}
.qv-stage .playbadge span{width:64px;height:64px;border-radius:50%;background:rgba(14,17,22,.8);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center}
.qv-detail{padding:18px 20px;display:grid;gap:14px}
.qv.expanded .qv-detail{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px 28px;padding:24px}
.qv-detail h4{margin:0 0 4px;font-size:12px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;color:var(--accent);font-weight:500}
.qv-detail p{margin:0;font-size:14px;line-height:1.7;color:var(--text-2)}
.qv-detail .note{grid-column:1/-1;background:var(--accent-bg);border-radius:12px;padding:14px 16px}
.qv-detail .note p{color:var(--text)}
.toolchips{display:flex;flex-wrap:wrap;gap:6px}
.toolchips span{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--text-2)}
.qv-foot{padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;border-top:1px solid var(--line);flex:none}
.qv-links{display:flex;flex-wrap:wrap;gap:8px}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,7,10,.7);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}

/* illustrative mock UIs */
.mock{padding:22px;display:flex;flex-direction:column;gap:14px;height:100%;font-size:14px;color:var(--text)}
.mock-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mock-h b{font-size:16px}
.mock-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;line-height:1.7;color:var(--text-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);color:var(--text-2);font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.wave{display:flex;align-items:center;gap:3px;height:56px;padding:0 4px}
.wave i{flex:1;background:var(--accent);border-radius:2px;opacity:.85;animation:wv 1.1s ease-in-out infinite}
@keyframes wv{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.player{display:flex;align-items:center;gap:12px}
.play{width:40px;height:40px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.bar{flex:1;height:4px;border-radius:2px;background:var(--line-2);position:relative;overflow:hidden}
.bar::after{content:"";position:absolute;inset:0;width:38%;background:var(--accent)}
.crew{display:grid;grid-template-columns:150px 1fr;gap:12px;flex:1}
.inbox{display:flex;flex-direction:column;gap:8px}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted)}
.ticket b{display:block;color:var(--text);font-size:13px}
.ticket.on{border-color:var(--accent)}
.chat{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.msg{max-width:85%;padding:10px 12px;border-radius:12px;line-height:1.6;font-size:13px}
.msg.in{background:var(--surface-2);color:var(--text-2);border-top-left-radius:4px}
.msg.out{align-self:flex-end;background:var(--accent-bg);color:var(--text);border:1px solid #4A3A16;border-top-right-radius:4px}
.ai{font-size:11px;color:var(--accent);font-family:'JetBrains Mono',monospace;letter-spacing:.08em;margin-bottom:4px}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:tp 1.2s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.3}30%{opacity:1}}

/* about + footer */
.about{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:48px}
.about p{margin:0 0 16px;font-size:16px;line-height:1.8;color:var(--text-2)}
.about p.muted{color:var(--muted)}
footer{padding:56px 0 64px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:24px}
.foot-title{font-size:28px;font-weight:700}
.foot-note{color:var(--muted);font-size:14px;margin-top:8px;line-height:1.6}
.foot-note a{color:var(--text-2)}

@media (max-width:640px){.crew{grid-template-columns:1fr}.inbox{display:none}.hero{padding:56px 0 40px}.bar-row{grid-template-columns:minmax(90px,120px) 1fr 24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="#top"><span class="logo" aria-hidden="true">W</span><span data-i18n="brand"></span></a>
    <nav>
      <a href="#skills" data-i18n="navSkills"></a>
      <a href="#works" data-i18n="navWorks"></a>
      <a href="#about" data-i18n="navAbout"></a>
      <a href="#contact" class="pill" data-i18n="navContact"></a>
      <button type="button" class="lang-toggle" id="langBtn">
        <span class="globe"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2B33D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span>
        <span class="track" aria-hidden="true"><span class="knob"></span><span class="lbl lbl-zh">中</span><span class="lbl lbl-en">EN</span></span>
      </button>
    </nav>
  </header>

  <main id="main">
    <div class="hero" id="top">
      <div class="mono" data-i18n="eyebrow"></div>
      <h1 data-i18n="name"></h1>
      <p class="role"><b data-i18n="roleTitle"></b> <span data-i18n="roleRest"></span></p>
      <p class="lead" data-i18n="lede"></p>
      <div class="ctas">
        <a href="#works" class="btn btn-accent" data-i18n="ctaWorks"></a>
        <a href="mailto:singwillychen@gmail.com" class="btn btn-ghost">Email</a>
        <a href="https://www.linkedin.com/in/piyoduck/" target="_blank" rel="noopener" class="btn btn-ghost">LinkedIn ↗</a>
        <a href="https://github.com/singwillychen" target="_blank" rel="noopener" class="btn btn-ghost">GitHub ↗</a>
      </div>
      <div class="stats" id="stats"></div>
    </div>

    <section id="skills">
      <div class="sec-head"><div><h2 data-i18n="skillsTitle"></h2><p class="sec-sub" data-i18n="skillsSub"></p></div></div>
      <div class="skills">
        <div class="panel"><h3 data-i18n="toolsTitle"></h3><p class="note" data-i18n="toolsNote"></p><div id="toolBars"></div></div>
        <div class="panel"><h3 data-i18n="catsTitle"></h3><p class="note" data-i18n="catsNote"></p><div id="catList"></div></div>
      </div>
    </section>

    <section id="works">
      <div class="sec-head">
        <div><h2 data-i18n="worksTitle"></h2><div class="count" id="count"></div></div>
        <div class="filters" role="group" id="filters"></div>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <section id="about">
      <div class="about">
        <div><div class="mono">ABOUT</div><h2 style="margin-top:12px" data-i18n="aboutTitle"></h2></div>
        <div><p data-i18n="about1"></p><p class="muted" data-i18n="about2"></p></div>
      </div>
    </section>
  </main>

  <footer id="contact">
    <div>
      <div class="foot-title" data-i18n="footTitle"></div>
      <div class="foot-note"><span data-i18n="footCredit"></span><br>© 2026 <span data-i18n="brand"></span> · <a href="https://github.com/singwillychen/ai-portfolio" target="_blank" rel="noopener">Source</a></div>
    </div>
    <div class="ctas">

    qv.style.left = left + 'px'; qv.style.top = top + 'px';
  }
  function section(title, text) { return text ? '<div><h4>' + esc(title) + '</h4><p>' + esc(text) + '</p></div>' : ''; }
  function renderStage(w) {
    var stage = $('qvStage'); stage.innerHTML = ''; stage.className = 'qv-stage';
    stage.hidden = !w.snap;
    if (!w.snap) return;
    if (w.snap.type === 'img') { var img = new Image(); img.src = w.snap.src; img.alt = f(w, 'name'); stage.appendChild(img); }
    else if (w.snap.type === 'mock') stage.appendChild(buildMock(w.snap.tpl));
    else if (w.snap.type === 'video') {
      stage.classList.add('video');
      if (qv.classList.contains('expanded')) {
        var fr = document.createElement('iframe');
        fr.src = 'https://www.youtube-nocookie.com/embed/' + w.snap.id + '?rel=0';
        fr.title = f(w, 'name');
        fr.allow = 'accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen';
        fr.allowFullscreen = true;
        stage.appendChild(fr);
      } else {
        stage.innerHTML = '<img src="https://i.ytimg.com/vi/' + w.snap.id + '/hqdefault.jpg" alt="' + esc(f(w, 'name')) + '"><span class="playbadge"><span>' + icon.play + '</span></span>';
      }
    }
  }
  function fillQV(w) {
    $('qvTitle').textContent = f(w, 'name');
    var kind = !w.snap ? 'info' : ({ img: 'shot', mock: 'mock', video: 'vid' })[w.snap.type];
    $('qvBadge').textContent = t()[kind];
    $('qvNote').textContent = kind === 'shot' ? t().noteShot : kind === 'mock' ? t().noteMock : kind === 'vid' ? t().noteVid : statusText(w);
    renderStage(w);
    var tools = (w.tools || []).map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('');
    $('qvDetail').innerHTML =
      section(t().hPain, f(w, 'pain_point')) + section(t().hSol, f(w, 'solution')) +
      section(t().hAI, f(w, 'ai_role')) + section(t().hHi, f(w, 'highlight')) +
      (tools ? '<div><h4>' + esc(t().hTools) + '</h4><div class="toolchips">' + tools + '</div></div>' : '') +
      (f(w, 'my_note') ? '<div class="note"><h4>' + esc(t().hNote) + '</h4><p>' + esc(f(w, 'my_note')) + '</p></div>' : '');
    $('qvLinks').innerHTML = w.links.map(linkHtml).join('');
    $('qvClose').setAttribute('aria-label', t().close);
    syncExpandBtn();
  }
  function syncExpandBtn() { $('qvExpand').setAttribute('aria-label', qv.classList.contains('expanded') ? t().shrink : t().expand); }
  function setExpanded(on) {
    if (on) qv.style.maxHeight = '';
    var changed = qv.classList.contains('expanded') !== on;
    qv.classList.toggle('expanded', on);
    scrim.classList.toggle('show', on);
    qv.setAttribute('aria-modal', String(on));
    syncExpandBtn();
    if (changed && current && current.snap && current.snap.type === 'video') renderStage(current);
    if (!on && anchor && qv.classList.contains('show')) place(anchor);
  }
  function openQV(w, btn, expand) {
    clearTimeout(closeTimer); clearTimeout(openTimer);
    if (anchor && anchor !== btn) anchor.setAttribute('aria-expanded', 'false');
    current = w; anchor = btn;
    fillQV(w);
    qv.querySelector('.qv-scroll').scrollTop = 0;
    btn.setAttribute('aria-expanded', 'true');
    if (expand) setExpanded(true);
    else if (!qv.classList.contains('expanded')) place(btn);
    qv.classList.add('show');
    if (expand) $('qvClose').focus();
  }
  function hoverOpen(w, btn) {
    if (qv.classList.contains('expanded') || Date.now() < quietUntil) return;
    clearTimeout(closeTimer); clearTimeout(openTimer);
    openTimer = setTimeout(function () { openQV(w, btn, false); }, 120);
  }
  function closeQV() {
    clearTimeout(openTimer); clearTimeout(closeTimer);
    qv.classList.remove('show');
    if (anchor) anchor.setAttribute('aria-expanded', 'false');
    var back = qv.classList.contains('expanded') ? anchor : null;
    if (back) quietUntil = Date.now() + 600; // the pointer may still rest on the button: don't pop the preview straight back
    setTimeout(function () {
      if (!qv.classList.contains('show')) { setExpanded(false); $('qvStage').innerHTML = ''; }
    }, 220);
    scrim.classList.remove('show');
    if (back) back.focus();
    current = null;
  }
  function scheduleClose() {
    clearTimeout(openTimer);
    if (qv.classList.contains('expanded')) return;
    closeTimer = setTimeout(function () {
      if (!qv.matches(':hover') && !qv.contains(document.activeElement) && !(anchor && anchor.matches(':hover'))) closeQV();
    }, 220);
  }
  qv.addEventListener('mouseenter', function () { clearTimeout(closeTimer); });
  qv.addEventListener('mouseleave', scheduleClose);
  $('qvClose').addEventListener('click', closeQV);
  $('qvExpand').addEventListener('click', function () { setExpanded(!qv.classList.contains('expanded')); });
  scrim.addEventListener('click', closeQV);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && qv.classList.contains('show')) closeQV(); });
  window.addEventListener('resize', function () { if (anchor && qv.classList.contains('show') && !qv.classList.contains('expanded')) place(anchor); });
  window.addEventListener('scroll', function () { if (qv.classList.contains('show') && !qv.classList.contains('expanded')) closeQV(); }, { passive: true });

  /* ---------- language ---------- */
  function renderAll() {
    document.documentElement.lang = state.lang === 'zh' ? 'zh-Hant-TW' : 'en';
    document.documentElement.setAttribute('data-lang', state.lang);
    document.title = t().title;
    $('langBtn').setAttribute('aria-label', t().toggleLabel);
    fillI18n(document);
    renderStats(); renderSkills(); renderFilters(); renderGrid();
  }
  $('langBtn').addEventListener('click', function () {
    state.lang = state.lang === 'zh' ? 'en' : 'zh';
    try { localStorage.setItem('pf-lang', state.lang); } catch (e) {}
    if (qv.classList.contains('show')) closeQV();
    renderAll();
    var btn = $('langBtn'), main = $('main');
    btn.classList.remove('spin'); main.classList.remove('pop');
    void btn.offsetWidth;
    btn.classList.add('spin'); main.classList.add('pop');
  });

  renderAll();
})();
</script>
</body>
</html>
